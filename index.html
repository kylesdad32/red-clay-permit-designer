<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Clay Permit Designer - Live Google Maps Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <header class="no-print bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-compass-drafting text-red-500 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Red Clay Permit Designer</h1>
                    <p class="text-xs text-slate-400">Live Google Maps & Building Footprint View</p>
                </div>
            </div>
            <button onclick="window.print()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center space-x-2 transition">
                <i class="fa-solid fa-print"></i>
                <span>Print / Save PDF</span>
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 no-print">
        <div class="lg:col-span-5 space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                <h2 class="font-semibold text-slate-800 text-base border-b border-slate-100 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-red-500"></i>
                    1. Property Address Search
                </h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Customer Street Address</label>
                    <div class="flex gap-2">
                        <input type="text" id="propAddress" value="3012 NW 30th St, Oklahoma City, OK 73112" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
                        <button onclick="updateMapLocation()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap transition cursor-pointer">Load Map</button>
                    </div>
                    <p id="lookupStatus" class="text-xs text-slate-500 mt-1">Loads Google Maps satellite & building layer.</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Applicant Name</label>
                        <input type="text" id="applicantName" value="Property Owner / Contractor" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Phone Number</label>
                        <input type="text" id="applicantPhone" value="405-802-6706" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                <h2 class="font-semibold text-slate-800 text-base border-b border-slate-100 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-ruler-combined text-red-500"></i>
                    2. Structure Dimensions
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Width (ft)</label>
                        <input type="number" id="structWidth" value="20" min="5" max="60" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Depth (ft)</label>
                        <input type="number" id="structDepth" value="20" min="5" max="60" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="font-semibold text-slate-800 text-base flex items-center gap-2">
                        <i class="fa-solid fa-map-location-dot text-red-500"></i>
                        Live Google Maps View (Satellite & Buildings Layer)
                    </h2>
                </div>
                <!-- EMBEDDED GOOGLE MAP FRAME -->
                <div class="w-full h-[450px] bg-slate-200 rounded-lg overflow-hidden relative border border-slate-300">
                    <iframe id="googleMapFrame" width="100%" height="100%" style="border:0;" loading="lazy" allowfullscreen 
                        src="https://www.google.com/maps/embed/v1/place?key=YOUR_GOOGLE_MAPS_API_KEY&q=3012+NW+30th+St+Oklahoma+City+OK&maptype=satellite">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateMapLocation() {
            const address = document.getElementById('propAddress').value;
            const encodedAddr = encodeURIComponent(address);
            const iframe = document.getElementById('googleMapFrame');
            // Updates iframe source to target the exact entered address with satellite view
            iframe.src = `https://www.google.com/maps/embed/v1/place?key=YOUR_GOOGLE_MAPS_API_KEY&q=${encodedAddr}&maptype=satellite`;
            document.getElementById('lookupStatus').innerText = "Google Maps updated for " + address;
        }
    </script>
</body>
</html>
